name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ingest-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ingest-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ingest-api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: pytest -q

  analyzer-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/analyzer-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/analyzer-worker/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: pytest -q

  web-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/web-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/web-ui/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: pytest -q

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t local/ingest-api services/ingest-api
      - run: docker build -t local/analyzer-worker services/analyzer-worker
      - run: docker build -t local/web-ui services/web-ui
      # Image vulnerability scan (OS packages + Python deps inside the image).
      # A CRITICAL or HIGH finding with a fix available fails the build, so an
      # image with a known exploitable hole is never published.
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: local/analyzer-worker
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: local/ingest-api
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: local/web-ui
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/sentinelops
      - run: helm template so deploy/sentinelops > /dev/null

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans the whole history, not just HEAD
      # Secret scanning: a token in any commit, past or present, fails the build.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install bandit pip-audit
      # SAST: static analysis of our own source for security bugs.
      - run: bandit -r services/ingest-api/app services/analyzer-worker/app services/web-ui/app
      # SCA: scan dependencies for known CVEs.
      - run: pip-audit -r services/ingest-api/requirements.txt
      - run: pip-audit -r services/analyzer-worker/requirements.txt
      - run: pip-audit -r services/web-ui/requirements.txt

  # Publish images to GitHub Container Registry on every push to main, so a user
  # can `helm install` without building anything. Gated on every other job, so a
  # red test never ships an image. Uses the built-in GITHUB_TOKEN: no secrets.
  publish:
    needs: [ingest-api, analyzer-worker, web-ui, docker-build, helm, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # for the signed build provenance below
      attestations: write
    strategy:
      # GHCR occasionally answers a push with "unknown blob"; one flaky push
      # must not cancel the other two images (seen on 5c8ead4).
      fail-fast: false
      matrix:
        service: [ingest-api, analyzer-worker, web-ui]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: services/${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:latest
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}
          # Links the package to this repo on GitHub and lets the AGPL notice
          # travel with the image.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=AGPL-3.0
      # Signed SLSA build provenance: cryptographic proof that this exact
      # image digest was built by this workflow from this commit. Anyone can
      # check it before running the image:
      #   gh attestation verify oci://ghcr.io/maxuver/sentinelops/analyzer-worker:latest --owner maxuver
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}/${{ matrix.service }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      # Software bill of materials: every package inside the image, as a
      # downloadable artifact, so a security team can read it instead of
      # trusting a README.
      - uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository }}/${{ matrix.service }}@${{ steps.build.outputs.digest }}
          artifact-name: sbom-${{ matrix.service }}.spdx.json
          output-file: sbom-${{ matrix.service }}.spdx.json

  # Publish the chart itself as an OCI artifact, so a user can
  #   helm install so oci://ghcr.io/maxuver/charts/sentinelops
  # with no git clone. Runs after the images so the chart never references an
  # image tag that does not exist yet.
  publish-chart:
    needs: [publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
      - run: helm package deploy/sentinelops --destination /tmp/chart
      - run: helm push /tmp/chart/sentinelops-*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
