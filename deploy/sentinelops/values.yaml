# SentinelOps Helm values. Defaults pull published images and run offline
# (stub LLM backend, no API key), so a plain `helm install` works anywhere.

# Published from CI on every push to main, so a plain `helm install` works
# with no build step. For local development, build with a :dev tag, load it
# into kind, and override these (see README, "Developing locally").
images:
  ingest: ghcr.io/maxuver/sentinelops/ingest-api:latest
  analyzer: ghcr.io/maxuver/sentinelops/analyzer-worker:latest
  webUi: ghcr.io/maxuver/sentinelops/web-ui:latest
  pullPolicy: IfNotPresent

redis:
  image: redis:7-alpine

# Incident history. Enabled by setting config.store=postgres.
# Set deploy=false to use an existing/managed database instead — then the DSN is
# read from the so-postgres-dsn Secret (see deploy/README.md).
postgres:
  deploy: true
  # pgvector build of Postgres 16: a drop-in that also gives the agent its
  # memory (ADR-0005). Plain postgres:16-alpine works too; memory then stays off.
  image: pgvector/pgvector:pg16
  user: sentinel
  database: sentinelops
  password: sentinel # demo default; override in any real deployment
  storage: 2Gi
  # Empty = the cluster's default StorageClass. EKS ships gp2 but does NOT
  # mark it default, so the PVC stays Pending forever there: set gp2 (or a
  # gp3 class you created). Seen on the second real EKS run, 2026-09-14.
  storageClass: ""

# Runtime configuration (SENTINELOPS_* env). Safe offline defaults: the stub
# backend needs no API key, and the k8s-events collector reads live cluster
# events. Add "prometheus,loki" to collectors per environment.
config:
  logLevel: INFO
  # stub | ollama | openai | anthropic. Selecting a backend is configuration,
  # never code (ADR-0002). API keys live in the so-llm Secret, never here.
  llmProvider: stub
  # Tiered: if the primary fails (quota, outage, timeout) this one answers
  # instead. "openai" + "ollama" = cloud quality when available, local and
  # free when not. Empty = no fallback.
  llmFallbackProvider: ""
  # ollama: a local model, zero egress, $0 per alert. The URL must be reachable
  # from inside the cluster: an in-cluster Ollama Service, or on kind/Docker
  # Desktop the host via http://host.docker.internal:11434.
  ollamaUrl: http://ollama:11434
  ollamaModel: qwen2.5:7b
  # Hard ceiling on one analysis call. A 7B model on CPU needs 30-60s; a cloud
  # model answers in a few seconds. Past it the raw alert is still delivered.
  llmTimeoutSeconds: 90
  # openai: any OpenAI-compatible endpoint. Default is DeepSeek (cheapest
  # capable cloud model); Groq, Together, OpenRouter, vLLM and LM Studio all
  # work by changing the URL. Key: so-llm Secret, key openai-api-key.
  openaiBaseUrl: https://api.deepseek.com/v1
  openaiModel: deepseek-chat
  # USD per million tokens, only used to record cost per incident. Defaults are
  # DeepSeek list prices; set to the provider's (Gemini 2.5 Flash: 0.30 / 2.50;
  # a free tier is 0 / 0).
  openaiPriceInPerMtok: 0.28
  openaiPriceOutPerMtok: 0.42
  # k8s-logs reads the alerting pod's current and previous container output
  # through the API, so a cluster without Loki still gives the model the line
  # that says why the process died. Add prometheus,loki when you have them.
  collectors: k8s-events,k8s-logs
  notifier: stub
  # memory | postgres. postgres stores the incident history (redacted only).
  store: memory
  prometheusUrl: http://localhost:9090
  lokiUrl: http://localhost:3100
  # Chat that receives incidents when notifier=telegram. The bot token is NOT
  # here: it lives in a Secret (see deploy/README.md), never in values.
  telegramChatId: ""

# Read-only incident-history UI. Needs config.store=postgres to have anything
# to read. No authentication yet, so its Service stays ClusterIP.
webUi:
  enabled: true

# The on-demand agent (ADR-0005): an engineer asks questions in Telegram; it
# answers with read-only tools, remembers past incidents, and writes the
# weekly incident review. Needs the so-telegram Secret and, for history and
# memory, config.store=postgres. Off by default because it needs a bot token.
agent:
  enabled: false
  # Chats allowed to talk to the agent (comma-separated). Defaults to
  # config.telegramChatId. Anyone else is ignored.
  telegramChatId: ""
  # Every question is bounded three ways.
  maxToolCalls: 6
  # A 7B model on CPU needs minutes for a multi-step question (measured: 41s
  # for one tool call, 8 min for four); a cloud model answers in ~20s.
  timeoutSeconds: 600
  dailyBudgetUsd: 2
  # Local embeddings through the same Ollama as the LLM; dimension must match.
  embedModel: nomic-embed-text
  embedDim: 768
  # Screenshots sent to the bot are transcribed by this vision model first
  # (ollama pull qwen2.5vl:7b). With the openai provider, leave empty to use
  # the chat model, or name a vision-capable one (e.g. gemini-2.5-flash).
  visionModel: qwen2.5vl:7b
  openaiVisionModel: ""
  # ollama | openai: which adapter reads screenshots. Local by default, so a
  # cloud quota running out never stops the bot from reading a picture.
  visionProvider: ollama
  # Runbooks to index into memory: filename -> markdown. Example:
  #   runbooks:
  #     dns-networkpolicy.md: |
  #       # DNS failures after a NetworkPolicy change
  #       Symptom: ... Fix: ...
  runbooks: {}

# The same read-only tools served over MCP, so Gemini CLI, Claude Code or
# Cursor can use SentinelOps as their memory of this cluster. ClusterIP only;
# reach it with `kubectl port-forward svc/<release>-mcp 8765`. Needs
# config.store=postgres for history and memory.
mcp:
  enabled: false
  port: 8765

# Read-only RBAC for the analyzer's collectors and the agent's tools:
# get/list/watch on events, and on ReplicaSets/Deployments so the agent can
# answer "what changed" (a new ReplicaSet is a rollout). No write verbs.
# clusterWide=true spans all namespaces; false restricts to the release namespace.
rbac:
  clusterWide: true

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi
