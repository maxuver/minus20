apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-analyzer-worker
  labels:
    {{- include "sentinelops.labels" . | nindent 4 }}
    app.kubernetes.io/component: analyzer-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: analyzer-worker
  template:
    metadata:
      # A changed ConfigMap does not restart pods on its own; this checksum
      # makes `helm upgrade --set config.x=...` roll the pod so it takes effect.
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        app.kubernetes.io/component: analyzer-worker
    spec:
      # Reads Kubernetes events with the least-privilege, read-only SA (rbac.yaml).
      serviceAccountName: {{ .Release.Name }}-analyzer
      # Long enough to finish one analysis (LLM timeout + delivery) after SIGTERM;
      # the worker stops reading immediately and exits when the message in hand
      # is done.
      terminationGracePeriodSeconds: 150
      containers:
        - name: analyzer-worker
          image: {{ .Values.images.analyzer }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
          env:
            # One consumer name per pod, so a message left pending by a pod that
            # died is visibly someone else's and gets reclaimed (XAUTOCLAIM),
            # instead of two pods sharing one name during a rollout.
            - name: SENTINELOPS_CONSUMER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- if eq .Values.config.store "postgres" }}
            # The DSN carries a password, so it lives in a Secret, not the ConfigMap.
            - name: SENTINELOPS_POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-postgres-dsn
                  key: dsn
            {{- end }}
            {{- if eq .Values.config.llmProvider "anthropic" }}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-llm
                  key: anthropic-api-key
            {{- end }}
            {{- if or (eq .Values.config.llmProvider "openai") (eq .Values.config.llmFallbackProvider "openai") }}
            - name: SENTINELOPS_OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-llm
                  key: openai-api-key
            {{- end }}
            {{- if eq .Values.config.notifier "slack" }}
            # An Incoming Webhook URL is itself the credential: anyone holding it
            # can post to the channel, so it belongs in a Secret, not the ConfigMap.
            - name: SENTINELOPS_SLACK_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-slack
                  key: webhook-url
            {{- end }}
            {{- if eq .Values.config.notifier "telegram" }}
            # Bot token comes from a Secret, never from values or the ConfigMap.
            - name: SENTINELOPS_TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-telegram
                  key: bot-token
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
