# Least-privilege access for the analyzer's Kubernetes-events collector and
# the agent's read-only tools: events, plus ReplicaSets/Deployments so "what
# changed" can be answered. No write verbs anywhere.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-analyzer
  labels:
    {{- include "sentinelops.labels" . | nindent 4 }}
---
{{- if .Values.rbac.clusterWide }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-analyzer-events-reader
  labels:
    {{- include "sentinelops.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  # pods/log lets the agent read a crash-looping container's output when the
  # team has no Loki. Still read-only: no exec, no delete, no patch.
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["replicasets", "deployments"]
    verbs: ["get", "list"]
  # Nodes are cluster-scoped, so only the cluster-wide role can read them;
  # the agent's node_status tool degrades to "unavailable" otherwise.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-analyzer-events-reader
  labels:
    {{- include "sentinelops.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-analyzer-events-reader
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-analyzer
    namespace: {{ .Release.Namespace }}
{{- else }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-analyzer-events-reader
  labels:
    {{- include "sentinelops.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  # pods/log lets the agent read a crash-looping container's output when the
  # team has no Loki. Still read-only: no exec, no delete, no patch.
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["replicasets", "deployments"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-analyzer-events-reader
  labels:
    {{- include "sentinelops.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-analyzer-events-reader
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-analyzer
    namespace: {{ .Release.Namespace }}
{{- end }}
