apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  labels:
    {{- include "sentinelops.labels" . | nindent 4 }}
data:
  SENTINELOPS_REDIS_URL: redis://{{ .Release.Name }}-redis:6379/0
  SENTINELOPS_LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  SENTINELOPS_LLM_PROVIDER: {{ .Values.config.llmProvider | quote }}
  SENTINELOPS_LLM_FALLBACK_PROVIDER: {{ .Values.config.llmFallbackProvider | quote }}
  SENTINELOPS_OLLAMA_URL: {{ .Values.config.ollamaUrl | quote }}
  SENTINELOPS_OLLAMA_MODEL: {{ .Values.config.ollamaModel | quote }}
  SENTINELOPS_LLM_TIMEOUT_SECONDS: {{ .Values.config.llmTimeoutSeconds | quote }}
  SENTINELOPS_STORM_WINDOW_SECONDS: {{ .Values.config.stormWindowSeconds | quote }}
  SENTINELOPS_OPENAI_BASE_URL: {{ .Values.config.openaiBaseUrl | quote }}
  SENTINELOPS_OPENAI_MODEL: {{ .Values.config.openaiModel | quote }}
  SENTINELOPS_OPENAI_PRICE_IN_PER_MTOK: {{ .Values.config.openaiPriceInPerMtok | quote }}
  SENTINELOPS_OPENAI_PRICE_OUT_PER_MTOK: {{ .Values.config.openaiPriceOutPerMtok | quote }}
  SENTINELOPS_COLLECTORS: {{ .Values.config.collectors | quote }}
  SENTINELOPS_NOTIFIER: {{ .Values.config.notifier | quote }}
  SENTINELOPS_PROMETHEUS_URL: {{ .Values.config.prometheusUrl | quote }}
  SENTINELOPS_LOKI_URL: {{ .Values.config.lokiUrl | quote }}
  SENTINELOPS_CLOUDWATCH_LOG_GROUP: {{ .Values.config.cloudwatchLogGroup | quote }}
  SENTINELOPS_CLOUDWATCH_CLUSTER_NAME: {{ .Values.config.cloudwatchClusterName | quote }}
  SENTINELOPS_AWS_REGION: {{ .Values.config.awsRegion | quote }}
  SENTINELOPS_TELEGRAM_CHAT_ID: {{ include "sentinelops.chatId" .Values.config.telegramChatId | quote }}
  SENTINELOPS_STORE: {{ .Values.config.store | quote }}
