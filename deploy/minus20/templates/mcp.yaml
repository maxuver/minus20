{{- if .Values.mcp.enabled }}
# The same read-only tools as the agent, served over MCP (streamable HTTP) so
# any agent CLI (Gemini CLI, Claude Code, Cursor) can use Minus20 as its
# memory of this cluster. ClusterIP only: reach it with kubectl port-forward.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-mcp
  labels:
    {{- include "minus20.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: mcp
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        app.kubernetes.io/component: mcp
    spec:
      serviceAccountName: {{ .Release.Name }}-analyzer
      containers:
        - name: mcp
          image: {{ .Values.images.analyzer }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          command: ["python", "-m", "app.mcp_server"]
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
          env:
            - name: MINUS20_MCP_TRANSPORT
              value: http
            - name: MINUS20_MCP_PORT
              value: {{ .Values.mcp.port | quote }}
            - name: MINUS20_EMBED_MODEL
              value: {{ .Values.agent.embedModel | quote }}
            - name: MINUS20_EMBED_DIM
              value: {{ .Values.agent.embedDim | quote }}
            {{- if eq .Values.config.store "postgres" }}
            - name: MINUS20_POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-postgres-dsn
                  key: dsn
            {{- end }}
          ports:
            - name: mcp
              containerPort: {{ .Values.mcp.port }}
          readinessProbe:
            tcpSocket:
              port: mcp
            initialDelaySeconds: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-mcp
  labels:
    {{- include "minus20.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: mcp
  ports:
    - name: mcp
      port: {{ .Values.mcp.port }}
      targetPort: mcp
{{- end }}
