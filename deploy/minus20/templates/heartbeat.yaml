{{- if .Values.heartbeat.url }}
# Dead man's switch (app/heartbeat.py). Every run checks that ingest-api is
# ready and that an analyzer-worker has polled the alert stream recently,
# then pings heartbeat.url, or <url>/fail with the reasons. If the node or
# the cluster dies, the pings stop and the external service alerts you:
# the one failure nothing inside the cluster can report. Read-only: it needs
# Redis and the ingest-api Service, not the Kubernetes API.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-heartbeat
  labels:
    {{- include "minus20.labels" . | nindent 4 }}
    app.kubernetes.io/component: heartbeat
spec:
  schedule: {{ .Values.heartbeat.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 120
      template:
        metadata:
          labels:
            app.kubernetes.io/component: heartbeat
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          containers:
            - name: heartbeat
              image: {{ .Values.images.analyzer }}
              imagePullPolicy: {{ .Values.images.pullPolicy }}
              command: ["python", "-m", "app.heartbeat"]
              envFrom:
                - configMapRef:
                    name: {{ .Release.Name }}-config
              env:
                - name: MINUS20_HEARTBEAT_URL
                  value: {{ .Values.heartbeat.url | quote }}
                - name: MINUS20_HEARTBEAT_INGEST_URL
                  value: "http://{{ .Release.Name }}-ingest-api:8080"
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
{{- end }}
