# Local Minus20 development cluster.
#
# Three nodes on purpose: a single-node cluster hides scheduling behaviour, and
# several fault-injection scenarios (node pressure, eviction, anti-affinity)
# only reproduce with real workers.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: minus20

nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # Grafana
      - containerPort: 30300
        hostPort: 3000
        protocol: TCP
      # Prometheus
      - containerPort: 30900
        hostPort: 9090
        protocol: TCP
      # Alertmanager
      - containerPort: 30903
        hostPort: 9093
        protocol: TCP
  - role: worker
  - role: worker
